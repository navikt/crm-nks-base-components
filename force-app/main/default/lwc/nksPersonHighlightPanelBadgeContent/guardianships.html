<template>
    <div class="slds-m-left_x-small backgroundStyling" lwc:if={showBadge}>
        <div class={headerLineStyling}></div>
        <div class="slds-m-around_medium">
            <p><strong>Vergemål</strong></p>
            <div class="flexWithGap">
                <template for:each={guardianships} for:item="guardianship">
                    <div key={guardianship.id}>
                        <p><strong>Type:</strong> {guardianship.typeLabel}</p>
                        <p><strong>Verge:</strong> {guardianship.motpartLabel}</p>
                        <p><strong>Embete:</strong> {guardianship.embete}</p>
                        <p lwc:if={guardianship.folkeregistermetadata.gyldighetstidspunkt}>
                            <strong>{guardianship.fromDateLabel}</strong>&nbsp;
                            <lightning-formatted-date-time
                                value={guardianship.folkeregistermetadata.gyldighetstidspunkt}
                                year="numeric"
                                month="numeric"
                                day="numeric"
                            ></lightning-formatted-date-time>
                            <span lwc:if={guardianship.folkeregistermetadata.opphoerstidspunkt}>
                                &nbsp;-&nbsp;
                                <lightning-formatted-date-time
                                    value={guardianship.folkeregistermetadata.opphoerstidspunkt}
                                    year="numeric"
                                    month="numeric"
                                    day="numeric"
                                ></lightning-formatted-date-time>
                            </span>
                        </p>
                        <p lwc:if={guardianship.vergeEllerFullmektig.tjenesteomraadeLabel}>
                            <strong>Område:</strong> {guardianship.vergeEllerFullmektig.tjenesteomraadeLabel}
                        </p>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
